<!DOCTYPE html>
<html>
  <head>
    <title>Tracking</title>
    <!-- This code is needed for responsive design to work. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/tracking.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="index.html" class="header-link" style="text-decoration: none;">
          <div class="brand-logo">
            Smart<span class="logo-accent">Cart</span>
          </div>
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="text" placeholder="Search">
        <button class="search-button">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html">
          <!-- <span class="returns-text">Returns</span> -->
          <span class="orders-text">Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <!-- Dynamically driven cart badge hook -->
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <div class="main">
      <div class="order-tracking">
        <a class="back-to-orders-link link-primary" href="orders.html">
          View all orders
        </a>

        <!-- Added js-delivery-date hook -->
        <div class="delivery-date js-delivery-date">
          Arriving on Monday, June 13
        </div>

        <!-- Added js-product-name hook -->
        <div class="product-info js-product-name">
          Black and Gray Athletic Cotton Socks - 6 Pairs
        </div>

        <!-- Added js-product-quantity hook -->
        <div class="product-info js-product-quantity">
          Quantity: 1
        </div>

        <!-- Added js-product-image hook -->
        <img class="product-image js-product-image" src="images/products/athletic-cotton-socks-6-pairs.jpg">

       <div class="progress-labels-container">
          <!-- We added hook classes here so JS can add/remove 'current-status' -->
          <div class="progress-label js-status-preparing">
            Preparing
          </div>
          <div class="progress-label js-status-shipped">
            Shipped
          </div>
          <div class="progress-label js-status-delivered">
            Delivered
          </div>
        </div>

        <div class="progress-bar-container">
          <!-- Added js-progress-bar hook here so JS can change the width% -->
          <div class="progress-bar js-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Script to execute dynamic data injection -->
    <script type="module" src="scripts/trackingPage.js"></script>
  </body>
</html>
